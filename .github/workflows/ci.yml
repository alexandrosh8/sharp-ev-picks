name: CI

on:
  push:
    branches: [main]
  pull_request:

# gitleaks-action v3 lists PR commits via the API on pull_request events —
# the default restricted GITHUB_TOKEN (contents: read only) 403s without
# pull-requests: read.
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://betting_ai:betting_ai@localhost:5433/betting_ai
      REDIS_URL: redis://localhost:6379/0

    # Throwaway service credentials are fixtures, never production secrets.
    # PostgreSQL runs both the Alembic gate and isolated DB-backed tests; Redis
    # exercises readiness and notification integration paths.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: betting_ai
          POSTGRES_PASSWORD: betting_ai
          POSTGRES_DB: betting_ai
          TZ: UTC
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U betting_ai -d betting_ai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # setup-uv publishes no moving major alias past v7 — pin the exact tag
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install all dependency groups and extras
        run: uv sync --frozen --all-extras --all-groups

      - name: Migration integrity
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Tests and coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      # Pin ruff so CI formatting matches local exactly — an unpinned `uvx ruff`
      # resolves whatever version the runner cached, which silently drifts from
      # the dev's ruff and fails format-check on identical code.
      - name: Lint
        run: uvx ruff@0.15.18 check app tests scripts alembic

      - name: Format check
        run: uvx ruff@0.15.18 format --check app tests scripts alembic

      - name: Types
        run: uv run mypy app tests

      - name: Dependency vulnerability audit
        run: |
          uv export --all-extras --all-groups --no-hashes --no-emit-project --output-file /tmp/requirements-audit.txt
          uvx pip-audit -r /tmp/requirements-audit.txt --no-deps --disable-pip

      - name: Safety audit (no bet-placement code path)
        run: bash scripts/safety_audit.sh

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
