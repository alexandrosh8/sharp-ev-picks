name: betting-ai

# Two deployment shapes, one file:
#   Mac dev   — `docker compose up -d postgres redis`; the app runs on the
#               host (scripts/run_app.sh). The app service is behind the
#               "prod" profile so a plain `docker compose up -d` never starts
#               it by surprise locally.
#   Ubuntu VPS — set COMPOSE_PROFILES=prod in the VPS .env (compose reads the
#               project .env automatically), then plain `docker compose up -d
#               --build` includes the app. Runbook:
#               docs/deployment/openclaw-ubuntu.md
#
# POSTGRES_PASSWORD must exist in the project .env for every compose shape.
# .env.example carries the loopback-only local fixture that matches its host
# DATABASE_URL; production Settings rejects that known default. Replace it in
# the VPS .env BEFORE first boot — pgdata is initialized with the first password.

x-logging: &default-logging
  # Docker's json-file driver is UNBOUNDED by default — a poll cycle every
  # ~5 minutes logging for months would fill the VPS disk without this cap.
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: betting_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: betting_ai
      TZ: UTC
    ports:
      # host 5433 — 5432 is taken by the weatherbot project's postgres.
      # 127.0.0.1 binds on every service: nothing is reachable from outside
      # the box (OpenClaw coexistence + defense in depth).
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betting_ai -d betting_ai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # appendonly: alert-dedupe keys (7-day TTL) survive a redis crash between
    # RDB snapshots — without AOF, a crash replays recent Telegram alerts
    # (annoyance, not a safety issue). maxmemory caps VPS RAM; volatile-ttl
    # evicts only TTL'd dedupe keys if the cap is ever hit.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-ttl",
      ]
    environment:
      TZ: UTC
    ports:
      # host 6380 — 6379 is taken by the weatherbot project's redis
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # Production app service (Stage 2 — Ubuntu/OpenClaw). For local Mac dev,
  # run the app on the host instead: scripts/run_app.sh.
  #
  # ONE INSTANCE ONLY — never `--scale app=2`: two replicas would race the
  # boot migration, double-scrape OddsPortal, and split the in-memory daily
  # exposure ledger across processes (ADR-0007).
  app:
    build: .
    profiles: ["prod"]
    env_file: .env
    # This environment block OVERRIDES .env on purpose (compose precedence:
    # environment > env_file). .env keeps HOST-side URLs (localhost:5433 /
    # localhost:6380) for host-run tools (alembic, scripts/, pytest); the
    # container must dial the compose-network service hostnames instead.
    # Do NOT delete this block as "duplicate" and do NOT point .env at
    # postgres:/redis: — each breaks the other shape.
    environment:
      TZ: UTC
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://betting_ai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/betting_ai
      REDIS_URL: redis://redis:6379/0
    ports:
      # Production requires loopback. SSH or a same-host TLS reverse proxy owns
      # the public interface; app/config.py rejects public APP_HOST_BIND values.
      - "${APP_HOST_BIND:-127.0.0.1}:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Value-filter ML artifacts are baked into the image (Dockerfile COPY of
    # data/ml/value_filter_manifest.json + value_filter_model.txt): the build
    # context carries them, whereas a ./data/ml bind mount resolves on the
    # Docker daemon's host filesystem — which is NOT this checkout — and
    # silently shadows the baked dir with an empty one.
    # Entrypoint (scripts/docker_entrypoint.sh) runs `alembic upgrade head`
    # before uvicorn — migrations apply on every boot, idempotently.
    healthcheck:
      # python:3.12-slim has no curl/wget — stdlib only. Keep the container
      # probe process-only: /ready and /health intentionally turn 503 while a
      # dependency is down or before the first long scrape cycle completes.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # The server binds quickly; the first scrape cycle does NOT block startup.
      start_period: 60s
    # Chromium (scrape concurrency 3, 20-40 min cycles) is memory-hungry; cap
    # it so a leak can never OOM a shared OpenClaw VPS. init: true reaps
    # zombie Chromium helper processes after browser crashes.
    # 3g (was 2g): at 2g the Python app (~1.5g) + 3 concurrent heavy match-page
    # Chromium tabs peaked AT the cgroup cap and the kernel OOM-killed a renderer
    # ("Target crashed", oom_kill=3). Host has ~12g free; 3g gives headroom.
    # shm_size 1g is belt-and-suspenders (Docker launch already sets
    # --disable-dev-shm-usage, but this protects the non-Docker arg path too).
    mem_limit: 3g
    shm_size: "1gb"
    cpus: 2
    pids_limit: 512
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # Chromium's namespace sandbox chroots its zygote after dropping the
      # outer privileges. No broader SYS_ADMIN capability is granted.
      - SYS_CHROOT
    security_opt:
      # Playwright's v1.60.0 default Docker profile plus clone/setns/unshare,
      # required for Chromium's sandbox under a non-root user.
      - seccomp:./docker/seccomp_profile.json
      - no-new-privileges:true
    # The image and venv remain immutable. Browser profiles/download scratch
    # and the unprivileged home are the only writable runtime surfaces.
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=1024m,uid=1000,gid=1000,mode=1777
      - /home/appuser:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000,mode=0700
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
